<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Tema claro forzado: estampa data-theme="light" antes del primer paint y bloquea modo oscuro -->
    <script>
      (function () {
        try {
          localStorage.setItem('theme', 'light');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <meta name="description" content="Mock te ayuda a hacer planes completos: la rutina y la nutrición de cada cliente en una sola herramienta. Vos ponés el criterio, la IA hace el trabajo pesado." />
    <title>Mock — Planes de entrenamiento y nutrición para coaches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
